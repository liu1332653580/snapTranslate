[package]
name = "snapocr"
version = "0.1.0"
description = "Screenshot to structured Markdown via GLM-4.6V"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "snapocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["image-png"] }
# Core plugins - temporarily disabled for CI testing
# tauri-plugin-global-shortcut = "2.0"
# tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
# tauri-plugin-store = "2.1"
# tauri-plugin-clipboard-manager = "2.0"
# tauri-plugin-dialog = "2.0"
# tauri-plugin-fs = "2.0"
# tauri-plugin-shell = "2.0"
# tauri-plugin-http = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image processing
image = "0.25"
base64 = "0.22"

# Screenshots — xcap is cross-platform and well-maintained
# Temporarily commented out for CI testing - will re-enable after basic build works
# xcap = "0.0.14"

# Time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 256
opt-level = "s"
lto = true
strip = true
