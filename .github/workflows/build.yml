name: Build SnapOCR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Rust binary (skip Tauri bundling)
        run: |
          cd src-tauri
          cargo build --release --verbose

      - name: Upload Rust executable
        uses: actions/upload-artifact@v4
        with:
          name: snapocr-rust-executable
          path: src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Build summary
        run: |
          echo "## Rust 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 成功生成 Rust 二进制文件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**说明**: 这是 Rust 核心功能，不含 Tauri 打包。" >> $GITHUB_STEP_SUMMARY
