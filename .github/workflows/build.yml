name: Build SnapOCR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Rust project (release mode)
        run: |
          cd src-tauri
          cargo build --release --verbose

      - name: Upload Rust executable (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-executable
          path: src-tauri/target/release/*.exe
          retention-days: 7

      - name: Build summary
        run: |
          echo "## Rust 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请下载 Artifacts 中的 `rust-executable` 查看 snapocr.exe" >> $GITHUB_STEP_SUMMARY
